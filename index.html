p: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(242,194,48,0.35) 30%, transparent 70%);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"position: relative; margin: 0 0 28px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.4em; color: #A39C90;\">FADE IN:<\u002Fp>\n      <h2 style=\"position: relative; margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 176px; line-height: 0.84; letter-spacing: 0.01em; word-spacing: 0.2em; text-transform: uppercase; color: #FFFAED;\">The next frame<br>is yours.<\u002Fh2>\n      <a href=\"mailto:dnovationmultimedia@gmail.com\" class=\"i3-tag\" style=\"position: relative; margin-top: -30px; display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; background: #F2C230; color: #000; text-decoration: none; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 32px; text-transform: uppercase;\">Let’s roll<\u002Fa>\n      <p style=\"position: relative; margin: 44px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; word-spacing: 0.8em; color: #C7C1B6;\">DNOVATIONMULTIMEDIA@GMAIL.COM · MUMBAI<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"i3-bar\" style=\"background: #000; position: relative; z-index: 3;\"><\u002Fdiv>\n    <footer style=\"border-top: 1px dashed #2B2824; padding: 28px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 24px; background: #000;\">\n      <nav style=\"display: flex; flex-direction: column; gap: 4px; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: 1;\">\n        <a href=\"#i3-top\" style=\"text-decoration: none;\">Home<\u002Fa><a href=\"#i3-skills\" style=\"text-decoration: none;\">Skills<\u002Fa><a href=\"#i3-work\" style=\"text-decoration: none;\">Work<\u002Fa><a href=\"mailto:dnovationmultimedia@gmail.com\" style=\"text-decoration: none;\">Contact<\u002Fa>\n      <\u002Fnav>\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;\">\n        <span style=\"font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 110px; line-height: 0.85; letter-spacing: 0.01em; word-spacing: 0.2em; text-transform: uppercase; color: #FFFAED;\">D’novation<br>Multimedia<\u002Fspan>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; word-spacing: 0.5em; color: #A39C90;\">DURGEESH WAGLE · DIRECTOR OF PHOTOGRAPHY<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: 1;\">\n        <a href=\"https://www.instagram.com/dopdurgeeshwagle/\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration: none;\">Instagram ↗<\u002Fa>\n        <a href=\"https://www.linkedin.com/in/durgeesh-wagle-6998543b/\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration: none;\">LinkedIn ↗<\u002Fa>\n        <span style=\"margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 14px; color: #A39C90;\">{{ist}} IST<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5600}}\">\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    this.state = { hov: -1, now: Date.now(), sk: 0 };\n    this.skCur = 0; this.skT = 0; this.skEls = []; this.skMoved = false; this.skDrag = false;\n    this.N = 12; this.c = []; this.pts = [];\n    for (let i = 0; i < this.N; i++) this.pts.push({ x: 900, y: 460 });\n    this.tx = 900; this.ty = 46
